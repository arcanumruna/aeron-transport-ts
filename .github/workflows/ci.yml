name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .refs
          key: refs-aeron-1.53.3-agrona-2.6.1
      - run: npm ci
      - run: npm run fetch:refs
      - run: npm run probe:multicast
      # The runner's NIC drains every off-host send at once, so libuv never queues one and dgram contract tests N3 and
      # N8 cannot see a full send buffer. Route TEST-NET-1 to a dummy interface behind a slow tbf qdisc, which holds the
      # datagrams charged to the socket, then probe that the queue fills.
      - name: Route the off-host address to a slow link
        run: |
          sudo ip link add rt0 type dummy
          sudo ip link set rt0 up
          sudo ip route add 192.0.2.0/24 dev rt0
          sudo tc qdisc add dev rt0 root tbf rate 8kbit burst 1600 limit 100000000
      - run: npm run probe:offhost
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
        env:
          # a host without IPv6 loopback or a route off the host fails the tests that need them instead of skipping them (#38);
          # the off-host route is the slow link set up above
          AERON_TS_REQUIRE_NET: '1'
          # the 1,000,000- and 10,000,000-iteration loops of the Java tests run in full on one job only
          AERON_TS_FULL_ITERATIONS: ${{ matrix.node == 24 && '1' || '' }}
      - run: npm run check:mapping

  # Interop with the real Aeron C 1.53.3 media driver (T23, spec 8.3, D105): the C driver and client library are built at
  # the pinned tag (cached by the tag), the C helpers of test/interop/c are built against them, and the suite runs.
  interop:
    runs-on: ubuntu-latest
    env:
      AERON_C_BUILD: ${{ github.workspace }}/.refs/aeron-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .refs
          key: refs-aeron-1.53.3-agrona-2.6.1
      - run: npm ci
      - run: npm run fetch:refs
      - name: Cache the Aeron C build
        id: aeron-c
        uses: actions/cache@v4
        with:
          path: .refs/aeron-build
          key: aeron-c-1.53.3-${{ runner.os }}
      - name: Build Aeron C 1.53.3 (driver and client library)
        if: steps.aeron-c.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build uuid-dev
          cmake -G Ninja -S .refs/aeron -B "$AERON_C_BUILD" -DCMAKE_BUILD_TYPE=Release \
            -DAERON_TESTS=OFF -DAERON_UNIT_TESTS=OFF -DAERON_SYSTEM_TESTS=OFF -DAERON_BUILD_DOCUMENTATION=OFF \
            -DAERON_INSTALL_TARGETS=OFF -DBUILD_AERON_ARCHIVE_API=OFF -DAERON_BUILD_SAMPLES=OFF
          ninja -C "$AERON_C_BUILD" aeronmd aeron
      - name: Build the C helpers
        run: node test/interop/build-c.mjs
      - run: npm run test:interop

  # Not a gate (plan, Performance gates): a shared runner is too noisy for a verdict. It runs the end-to-end benches once
  # and posts the numbers to the summary of the run; `npm run bench:gate` on an idle machine is the gate.
  bench-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: End-to-end benches (TS to TS on the loopback, with the dgram floor)
        run: |
          {
            npm run --silent bench:e2e
            echo
            echo '#### The end-to-end benches as the gate runs them (`npm run bench:micro -- --file e2e`)'
            echo
            echo '```'
            npm run --silent bench:micro -- --file e2e 2>&1 >/dev/null
            echo '```'
            echo
            echo '#### The fan-out benches as the gate runs them (`npm run bench:micro -- --file fanout`)'
            echo
            echo '```'
            npm run --silent bench:micro -- --file fanout 2>&1 >/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
